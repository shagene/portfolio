name: Weekly GitHub activity refresh

on:
  schedule:
    - cron: "17 6 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-github-activity-refresh
  cancel-in-progress: false

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v6

      - name: Use the project Node release
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the site
        run: npm run check

      - name: Refresh GitHub activity cache
        run: npm run refresh:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse unrelated generated changes
        run: |
          git diff --exit-code -- . ':(exclude)src/data/github-activity-cache.json'

      - name: Commit refreshed cache when it changed
        run: |
          if git diff --quiet -- src/data/github-activity-cache.json; then
            echo "GitHub activity cache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-activity-cache.json
          git commit -m "chore: refresh GitHub activity cache"
          git push origin HEAD:main
