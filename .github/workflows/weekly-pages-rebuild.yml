name: Weekly portfolio rebuild

on:
  schedule:
    - cron: "17 6 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: portfolio-production-deploy
  cancel-in-progress: false

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v6

      - name: Use the project Node release
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the site
        run: npm run check

      - name: Build with current GitHub activity
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LIVE_REQUIRED: "1"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.120.1"
          command: >-
            pages deploy dist
            --project-name=steven-hagene-portfolio
            --branch=main
            --commit-hash=${{ github.sha }}

      - name: Verify the deployed site
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error --retry 5 "$DEPLOYMENT_URL/"
          curl --fail --silent --show-error --retry 5 "$DEPLOYMENT_URL/github/"
          curl --fail --silent --show-error --retry 5 "$DEPLOYMENT_URL/sitemap-index.xml"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/weekly-404-check/")" = "404"
